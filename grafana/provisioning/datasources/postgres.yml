apiVersion: 1
datasources:
  - name: Pharma Postgres
    uid: pharma-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader          # read-only login created by `pipeline.publish`
    isDefault: true
    editable: false
    jsonData:
      database: ${GRAFANA_PIPELINE_DB}   # pharma_staging unless rehearsing against a clone
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
