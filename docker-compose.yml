# Phase 1 local services: Postgres (staging), Airflow (orchestration), Grafana (dashboards).
services:
  postgres:
    image: postgres:16-alpine  # 16+ required: validation uses pg_input_is_valid()
    container_name: pharma-staging-pg
    environment:
      POSTGRES_DB: ${PG_DB:-pharma_staging}
      POSTGRES_USER: ${PG_USER:-pharma}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pharma_dev_password}
    # Memory sized for bulk staging/validation of the ~500k-row sales batch on a
    # 4 GB Docker VM; defaults (4 MB work_mem, 8 MB temp_buffers) spill to disk.
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=128MB
      -c maintenance_work_mem=256MB
      -c temp_buffers=256MB
      -c max_wal_size=2GB
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pg_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build: ./airflow
    image: pharma-airflow:local
    container_name: pharma-airflow
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/airflow/project/airflow/entrypoint.sh"]
    environment:
      # Airflow keeps its metadata in its own database on the shared Postgres.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-pharma}:${PG_PASSWORD:-pharma_dev_password}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/airflow/dags
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__PARALLELISM: "4"
      # Pipeline code and settings: same staging database, reached by service name.
      PYTHONPATH: /opt/airflow/project
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${AIRFLOW_PIPELINE_DB:-pharma_staging}
      PG_USER: ${PG_USER:-pharma}
      PG_PASSWORD: ${PG_PASSWORD:-pharma_dev_password}
      # Paths are relative to the project root. Override the AIRFLOW_* variables to rehearse
      # against a separate database/warehouse without touching the real one.
      SOURCE_DIR: ${AIRFLOW_SOURCE_DIR:-dataset}
      LANDING_DIR: ${AIRFLOW_LANDING_DIR:-landing}
      DUCKDB_PATH: ${AIRFLOW_DUCKDB_PATH:-warehouse/pharma_sdi.duckdb}
    volumes:
      - ./:/opt/airflow/project
    ports:
      - "8080:8080"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: pharma-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin            # local development only
      GF_AUTH_ANONYMOUS_ENABLED: "true"            # read-only viewing without login (demo)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/de-batch-ingestion.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Read-only database login created by pipeline.publish (see pipeline/publish.py).
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_reader_pw}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  pg_staging_data:
  grafana_data:
